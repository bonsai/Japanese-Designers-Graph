<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="日本のファッションデザイナー、ブランド、作品、概念をつなぐセマンティックグラフ">
<title>Japanese Designers Graph</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#191b21;--line:#353944;--text:#f3f3f5;--muted:#a7adba;--accent:#d6ff64}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:28px clamp(18px,4vw,56px);border-bottom:1px solid var(--line)}h1{font-size:clamp(1.5rem,3vw,2.4rem);margin:0 0 6px}header p,.muted{color:var(--muted);margin:0}
main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:16px;padding:18px clamp(12px,3vw,40px)}section{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.section-head{padding:16px;border-bottom:1px solid var(--line);display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}h2{font-size:1rem;margin:0}
#graph{width:100%;height:min(68vh,650px);min-height:380px;display:block}svg text{font-family:inherit;fill:var(--text);font-size:13px;pointer-events:none}svg .edge{stroke:#596070;stroke-width:1.5}svg .node{cursor:pointer;stroke:var(--accent);stroke-width:1.5}svg .node.brand{fill:#343d2b}svg .node.person{fill:#27364b}svg .node.selected{stroke-width:4}
aside{padding:18px}label{display:block;font-size:.85rem;color:var(--muted);margin:14px 0 5px}input,select,textarea,button{font:inherit;color:var(--text);background:#101216;border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}button{cursor:pointer;background:var(--accent);color:#11150a;border:0;font-weight:700}button.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}.actions{display:flex;gap:8px;margin-top:12px}.actions>*{flex:1}.list{padding:10px 16px 16px;display:grid;gap:8px}.item{padding:10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}.item:hover{border-color:var(--accent)}.pill{display:inline-block;color:var(--accent);font-size:.75rem;margin-right:8px}.status{padding:12px 16px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line)}
@media(max-width:850px){main{grid-template-columns:1fr}#graph{height:52vh;min-height:330px}}
</style>
</head>
<body>
<header><h1>Japanese Designers Graph</h1><p>人物・ブランド・作品・思想をつなぐ、拡張可能なセマンティックグラフ</p></header>
<main>
<section><div class="section-head"><h2>Relationship graph</h2><span id="counts" class="muted"></span></div><svg id="graph" role="img" aria-label="デザイナーとブランドの関係グラフ"></svg><div class="status">ノードを選択すると詳細が表示されます。現在のデータはシードで、関係の出典確認は今後追加します。</div></section>
<section><div class="section-head"><h2>Explore & add</h2></div><aside>
<label for="search">検索</label><input id="search" placeholder="人物・ブランド・概念を検索">
<div id="results" class="list"></div>
<div style="border-top:1px solid var(--line);padding-top:14px;margin-top:8px"><h2>おすすめの探索先</h2><div id="recommendations" class="list"><p class="muted">レコメンドを読み込み中…</p></div></div>
<div style="border-top:1px solid var(--line);padding-top:16px;margin-top:8px"><h2>選択中のノード</h2><div id="detail" class="muted" style="margin-top:8px">グラフまたは検索結果から選択してください。</div></div>
<div style="border-top:1px solid var(--line);padding-top:16px;margin-top:18px"><h2>ノードを追加（このブラウザ内）</h2>
<label for="nodeName">名前</label><input id="nodeName" placeholder="例：長見佳祐">
<label for="nodeType">種類</label><select id="nodeType"><option value="person">人物</option><option value="brand">ブランド</option><option value="work">作品・コレクション</option><option value="concept">概念</option><option value="organization">組織</option></select>
<label for="nodeDesc">説明</label><textarea id="nodeDesc" rows="2" placeholder="確認済みの説明、または調査メモ"></textarea>
<div class="actions"><button id="addNode">追加</button><button id="export" class="secondary">JSON出力</button></div>
<p class="muted" style="font-size:.8rem;margin-top:10px">追加データはダウンロードして保存できます。サーバー接続前のためGitHub上のデータは自動更新されません。</p>
</div></aside></section>
</main>
<script>
const svgNS="http://www.w3.org/2000/svg";let graphData={nodes:[],edges:[],sources:[]},recommendationsData=[],selectedId=null;
const $=id=>document.getElementById(id);
function el(tag,attrs={},text){const n=document.createElementNS(svgNS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);if(text!==undefined)n.textContent=text;return n}
function html(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
async function init(){try{const r=await fetch('./data/seeds.json');if(!r.ok)throw Error('seed load failed');graphData=await r.json();render();try{const rr=await fetch('./data/recommendations.json');if(rr.ok){const rd=await rr.json();recommendationsData=Array.isArray(rd.recommendations)?rd.recommendations:[]}}catch(e){console.warn('recommendations unavailable',e)}renderRecommendations()}catch(e){$('counts').textContent='データを読み込めません';console.error(e)}}
function render(){const nodes=graphData.nodes,edges=graphData.edges;$('counts').textContent=nodes.length+' nodes · '+edges.length+' relations';const svg=$('graph');svg.replaceChildren();const w=svg.clientWidth||600,h=svg.clientHeight||450;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);const pos={};nodes.forEach((n,i)=>{const a=2*Math.PI*i/Math.max(nodes.length,1)-Math.PI/2;pos[n.id]={x:w/2+Math.cos(a)*Math.min(w*.32,210),y:h/2+Math.sin(a)*Math.min(h*.32,170)}});for(const e of edges){const a=pos[e.source],b=pos[e.target];if(!a||!b)continue;svg.append(el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:'edge'}));const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;svg.append(el('text',{x:mx,y:my-5,'text-anchor':'middle',style:'font-size:10px;fill:#b7bdc9'},e.predicate))}
for(const n of nodes){const p=pos[n.id],g=el('g');g.append(el('circle',{cx:p.x,cy:p.y,r:10,class:'node '+n.type+(selectedId===n.id?' selected':'')}));const anchor=p.x>w*.7?'end':p.x<w*.3?'start':'middle';g.append(el('text',{x:p.x+(anchor==='end'?-14:anchor==='start'?14:0),y:p.y+27,'text-anchor':anchor},n.name));g.addEventListener('click',()=>selectNode(n.id));svg.append(g)}renderList()}
function renderList(){const q=$('search').value.trim().toLowerCase(),box=$('results');box.replaceChildren();graphData.nodes.filter(n=>(n.name+' '+(n.aliases||[]).join(' ')+' '+(n.description||'')).toLowerCase().includes(q)).slice(0,30).forEach(n=>{const item=html('div','item');item.append(html('span','pill',n.type),html('strong','',n.name));item.addEventListener('click',()=>selectNode(n.id));box.append(item)})}
function renderRecommendations(){const box=$('recommendations');if(!box)return;box.replaceChildren();if(!recommendationsData.length){box.append(html('p','muted','まだレコメンドはありません。gh aw の調査結果はレビュー用PRを通して追加されます。'));return}recommendationsData.forEach(rec=>{const item=html('div','item');item.append(html('strong','',rec.title||'探索候補'),html('p','',rec.summary||rec.reason||''),html('span','pill',(rec.confidence||'unknown')+' · '+(rec.status||'candidate')));(rec.node_ids||[]).forEach(id=>{const n=graphData.nodes.find(x=>x.id===id);if(n){const link=html('p','muted','↳ '+n.name);link.style.margin='6px 0 0';link.style.cursor='pointer';link.addEventListener('click',()=>selectNode(id));item.append(link)}});if(rec.sources&&rec.sources.length){rec.sources.forEach(s=>{if(s.url&&/^https:\/\//.test(s.url)){const a=html('a','',s.title||s.url);a.href=s.url;a.target='_blank';a.rel='noopener noreferrer';a.style.color='var(--accent)';item.append(a)}})}box.append(item)})}
function selectNode(id){selectedId=id;const n=graphData.nodes.find(x=>x.id===id);if(!n)return;const d=$('detail');d.replaceChildren();d.append(html('div','pill',n.type),html('h3','',n.name),html('p','',n.description||'説明は未登録です。'),html('p','muted','ID: '+n.id));const rel=graphData.edges.filter(e=>e.source===id||e.target===id);d.append(html('h3','','関係 ('+rel.length+')'));rel.forEach(e=>{const other=graphData.nodes.find(x=>x.id===(e.source===id?e.target:e.source));if(other){const p=html('p','',e.predicate+' → '+other.name+' ['+e.status+']');d.append(p)}});render()}
$('search').addEventListener('input',renderList);
$('addNode').addEventListener('click',()=>{const name=$('nodeName').value.trim();if(!name){$('nodeName').focus();return}const id=$('nodeType').value+':'+name.normalize('NFKC').toLowerCase().replace(/[^a-z0-9\u3040-\u30ff\u3400-\u9fff]+/g,'-').replace(/^-|-$/g,'');if(graphData.nodes.some(n=>n.id===id)){alert('同じIDのノードが存在します');return}const n={id,type:$('nodeType').value,name,aliases:[],description:$('nodeDesc').value.trim(),status:'unverified'};graphData.nodes.push(n);$('nodeName').value='';$('nodeDesc').value='';selectNode(id)});
$('export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(graphData,null,2)+'\n'],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='designers-graph.json';a.click();URL.revokeObjectURL(url)});
window.addEventListener('resize',()=>render());init();
</script>
</body></html>
