name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "space.html"
      - "cube.html"
      - "semantic-space.js"
      - "data/**"
      - "assets/**"
      - ".github/workflows/dep.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp space.html _site/space.html
          cp cube.html _site/cube.html
          cp semantic-space.js _site/semantic-space.js
          cp -R data _site/data
          if [ -d assets ]; then cp -R assets _site/assets; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
